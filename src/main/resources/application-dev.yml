spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:siede}
    username: ${DB_USERNAME:siede}
    password: ${DB_PASSWORD:siede}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace