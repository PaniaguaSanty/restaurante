services:
  postgres:
    image: postgres:16-alpine
    container_name: siede-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-siede}
      POSTGRES_USER: ${DB_USERNAME:-siede}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-siede}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - siede-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - siede-network

volumes:
  siede-postgres-data:

networks:
  siede-network:
    driver: bridge